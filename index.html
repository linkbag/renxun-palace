<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#201b18">
  <meta name="description" content="《后宫仁薰传·十一日回宫》是一出九折可玩的宫闱商战短剧。替薰妃填一张访客签，替掌炉人交三印，到长案堂亲自滴墨验单。">
  <title>后宫仁薰传 · 十一日回宫</title>
  <link rel="icon" href="assets/seal.svg" type="image/svg+xml">
  <link rel="preload" as="font" type="font/woff" href="assets/brush.woff" crossorigin>
  <link rel="preload" as="image" href="assets/cover.webp" fetchpriority="high">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="play.css">
  <script src="story.js" defer></script>
  <script src="engine.js" defer></script>
  <script src="theatre.js" defer></script>
</head>
<body>
  <svg class="symbol-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-gate" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round" stroke-linecap="round"><path d="M3 12c5.3 0 10-3 13-7 3 4 7.7 7 13 7M5 13.5h22M9 14v8m14-8v8M12 15.5h8v7h-8zM6 23.5h20M4 26h24M15 4h2"/><path d="M6 10c-1 .1-2-.4-2.4-1.2m22.4 1.2c1 .1 2-.4 2.4-1.2"/></g></symbol>
    <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M6 5h13a2 2 0 0 0-4 0v12.5a2 2 0 0 1-2 2h-8a2 2 0 0 1 0-4h10M6 5v10.5M9 8h3m-3 3h3"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.2"/><path d="M3.5 19v-1c0-3 2.8-5.3 6.5-5.3s6.5 2.3 6.5 5.3v1zM16 5.7a3.2 3.2 0 0 1 0 6.1m2.1 2.6a5.4 5.4 0 0 1 2.4 4.5"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="m11.8 4.8-5.1 4H3.5v6.4h3.2l5.1 4zM15.5 9a4 4 0 0 1 0 6m2.7-9.2a8 8 0 0 1 0 12.4"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="m11.8 4.8-5.1 4H3.5v6.4h3.2l5.1 4zM16 9.5l4.5 5m0-5-4.5 5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.8a.5.5 0 0 1 .8-.4l11 7.2a.5.5 0 0 1 0 .8l-11 7.2a.5.5 0 0 1-.8-.4z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.3"/><path d="M12 7.4v5l3.1 1.7"/></symbol>
    <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="7" cy="5" r="2"/><circle cx="17" cy="7" r="2"/><circle cx="7" cy="19" r="2"/><path d="M7 7v10m0-2c8 0 10-3.5 10-6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.3 6.2-6 5.8 6 5.8"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.7 6.2 6 5.8-6 5.8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5.8" y="10.5" width="12.4" height="9" rx="1.8"/><path d="M8.4 10.5V7.7a3.6 3.6 0 0 1 7.2 0v2.8M12 14.5v2"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.3C9 4.5 5.5 4.4 3 5.1v13c3-.8 6-.5 9 1 3-1.5 6-1.8 9-1v-13c-2.5-.7-6-.6-9 1.2zm0 0v12.8"/></symbol>
  </defs></svg>

  <header class="masthead" id="masthead">
    <div class="mast-inner wrap">
      <button class="brand" id="brand" aria-label="仁薰剧场首页"><span class="brand-seal"><svg aria-hidden="true"><use href="#i-gate"/></svg></span><span>仁薰剧场</span></button>
      <nav class="main-nav" aria-label="剧场导航">
        <button class="nav-link current" data-nav="home">剧场首页</button>
        <button class="nav-link" data-nav="chapters">九折戏目</button>
        <button class="nav-link" data-nav="cast">人物簿</button>
      </nav>
      <button class="sound-button" id="sound" aria-pressed="false" aria-label="开启声效"><svg class="icon" aria-hidden="true"><use href="#i-muted"/></svg><span>声效关</span></button>
    </div>
  </header>

  <main id="home-screen">
    <section class="marquee" aria-labelledby="play-title">
      <div class="poster" aria-hidden="true"></div><div class="poster-shade" aria-hidden="true"></div>
      <div class="wrap marquee-inner">
        <div class="hero-copy">
          <div class="genre"><i></i><span>宫闱商战</span><b>◆</b><span>互动短剧</span></div>
          <h1 id="play-title">后宫仁薰传</h1>
          <div class="subtitle"><span class="ornament" aria-hidden="true"></span>十一日回宫<span class="ornament mirror" aria-hidden="true"></span></div>
          <p class="prologue">创炉三十三年，离宫十一日。<br>满城恭迎薰妃，宫门却请他去排访客队。</p>
          <div class="hero-actions">
            <button id="begin" class="btn btn-vermilion"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg><span>入宫开戏</span></button>
            <button id="hero-cast" class="btn btn-ghost"><svg class="icon" aria-hidden="true"><use href="#i-people"/></svg>翻阅人物簿</button>
          </div>
          <div class="specs"><span><svg class="icon" aria-hidden="true"><use href="#i-scroll"/></svg>全九折</span><i></i><span><svg class="icon" aria-hidden="true"><use href="#i-branch"/></svg>多线结局</span><i></i><span id="save-caption">自动存档</span></div>
        </div>
      </div>
      <div class="hero-bottom" aria-hidden="true"></div>
    </section>

    <section class="programme" id="programme" aria-labelledby="programme-title">
      <div class="wrap">
        <div class="programme-head">
          <div class="section-heading"><span class="section-mark" aria-hidden="true">折子</span><h2 id="programme-title">九折戏目</h2></div>
          <div class="rail-tools"><span id="rail-count" aria-hidden="true">01 <i>/ 09</i></span><button id="prev-card" class="icon-button" aria-label="上一组戏目"><svg class="icon"><use href="#i-left"/></svg></button><button id="next-card" class="icon-button" aria-label="下一组戏目"><svg class="icon"><use href="#i-right"/></svg></button></div>
        </div>
        <div class="chapter-rail" id="chapter-rail" aria-label="全剧九折，可横向浏览"></div>
      </div>
    </section>
    <footer class="credits-bar"><div class="wrap footer-inner"><span>仁薰剧场 <i>·</i> 非官方戏拟作品</span><button id="notes">片尾与取材 <svg aria-hidden="true" class="icon"><use href="#i-book"/></svg></button></div></footer>
  </main>

  <section id="play-screen" hidden aria-label="剧情舞台"></section>
  <dialog id="folio" aria-labelledby="folio-title"><div class="folio-header"><div class="folio-titlebox"><span class="folio-overline">仁 薰 剧 场</span><h2 id="folio-title"></h2></div><button id="folio-close" class="icon-button" aria-label="合上册页"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div><div id="folio-body" class="folio-body"></div></dialog>
  <noscript>请开启浏览器的 JavaScript 以进入剧场。</noscript>
</body>
</html>
